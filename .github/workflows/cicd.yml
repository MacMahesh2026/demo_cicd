name: Java CI/CD with Maven

on:
  push:
    branches: [ "main", "dev" ] # Add your specific branch names here
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/actions-setup-java@v4
        with:
          java-version: '21' # Change to '11' or '21' if your project uses a different version
          distribution: 'temurin'
          cache: 'maven' # Automatically caches dependencies to speed up future runs

      - name: Build and Test with Maven
        run: mvn -B clean verify
